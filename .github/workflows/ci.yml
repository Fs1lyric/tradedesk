name: ci
on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: timescale/timescaledb-ha:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tradedesk_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 20
      redis:
        image: redis:7
        ports: ["6379:6379"]
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/tradedesk_test
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv python install 3.12
      - run: uv sync --extra dev --python 3.12
      - name: lint
        run: uv run ruff check .
      - name: typecheck
        run: uv run mypy app
      - name: tests
        run: uv run pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run screenshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: frontend/e2e/screens/

  extension:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run screenshots
      - run: npm run zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: extension-screenshots
          path: extension/e2e/screens/
      - uses: actions/upload-artifact@v4
        with:
          name: tradedesk-extension
          path: extension/tradedesk-extension.zip

  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: compose file is valid
        run: cp .env.example .env && docker compose config -q
      - name: backend image builds and imports
        run: |
          docker build -t tradedesk-backend backend
          docker run --rm -e JWT_SECRET=$(printf 'x%.0s' $(seq 32)) \
            -e MASTER_KEY=$(head -c 32 /dev/zero | base64) tradedesk-backend \
            python -c "from app.main import create_app; create_app(); import app.workers.tasks"
